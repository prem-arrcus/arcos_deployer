name: ShellCheck

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Run ShellCheck
        run: |
          shellcheck --external-sources -S warning \
            launch_arcos.sh \
            lib/init \
            lib/pda \
            hooks/pre-commit \
            hooks/install-hooks.sh
        continue-on-error: false
